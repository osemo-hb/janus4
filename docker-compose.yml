services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: janus3_postgres
    environment:
      POSTGRES_DB: janus3_db
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: janus_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./libs/janus-core/src/janus_core/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus3_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: janus3_redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:

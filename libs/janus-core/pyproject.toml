[project]
name = "janus-core"
version = "4.0.0"
description = "Core library for Janus conversational memory system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.3.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "numpy>=1.24.0",
    "opentelemetry-api>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
janus-consumer = "janus_core.consumer.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

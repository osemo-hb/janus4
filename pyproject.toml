[project]
name = "janus"
version = "4.0.0"
description = "Conversational memory system for LLM applications"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["libs/*", "server/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs/janus-core/tests", "server/janus-app/tests"]
